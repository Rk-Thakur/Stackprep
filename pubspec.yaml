name: stackprep
description: "Stackprep - coding interview preparation for Kotlin, Swift, Flutter, and React Native developers."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  cloud_firestore: ^6.8.0
  cross_file: ^0.3.5
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  equatable: ^2.1.0
  file_picker: ^13.1.0
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3

  get_it: ^9.2.1
  google_fonts: ^6.2.1
  google_sign_in: ^7.2.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  pdf: ^3.13.1
  shared_preferences: ^2.5.3
  skeletonizer: ^2.1.3

dev_dependencies:
  file_picker_platform_interface: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#150f08"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  macos:
    generate: true
  windows:
    generate: true
  web:
    generate: true
